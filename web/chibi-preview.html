<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match Chibi V1 / V2 对照</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", sans-serif; background: #09130f; color: #edf7ef; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: radial-gradient(circle at 50% 0%, #1e442f 0, #09130f 54%); }
      main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 52px); letter-spacing: -.04em; }
      h2 { margin: 38px 0 8px; font-size: 22px; }
      p { margin: 10px 0; color: #b8cabc; line-height: 1.65; }
      .notice { max-width: 820px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 160px)); justify-content: start; gap: 14px; margin-top: 18px; }
      .tile { min-width: 0; padding: 12px; border: 1px solid rgba(210, 245, 220, .14); border-radius: 18px; background: rgba(10, 25, 18, .72); }
      .artbox { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; border-radius: 12px; background-color: #dfe9e2; background-image: linear-gradient(45deg, #c9d5cd 25%, transparent 25%), linear-gradient(-45deg, #c9d5cd 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #c9d5cd 75%), linear-gradient(-45deg, transparent 75%, #c9d5cd 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
      .artbox img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
      .label { padding: 10px 2px 2px; color: #f5fff7; font-size: 13px; letter-spacing: .02em; }
      .v1-pair { position: relative; }
      .v1-pair img { position: absolute; inset: 0; }
      .v1-pair .head { width: 47%; height: 47%; left: 27%; top: 7%; object-fit: cover; border-radius: 50%; }
      .v1-pair .body { top: 20%; height: 80%; }
      .tag { display: inline-flex; align-items: center; padding: 5px 9px; margin-right: 7px; border-radius: 999px; background: #2d6a47; color: #eaffef; font-size: 12px; }
      .tag.old { background: #6c4232; }
      @media (max-width: 520px) { main { width: min(100% - 20px, 1180px); padding-top: 26px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; } .tile { padding: 8px; border-radius: 13px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>比赛 Chibi：V1 / V2</h1>
      <p class="notice"><span class="tag old">V1 拆分</span>头与身体分别生成再叠放，颈口、透视与动作重心容易割裂。<span class="tag">V2 整身</span>每个动作是一张完整透明图，共用方形占位和脚底基线。</p>

      <h2>V1：头身运行时拼接（历史对照）</h2>
      <div class="grid" id="v1"></div>

      <h2>V2：纱夜整身动作</h2>
      <div class="grid" id="saya"></div>

      <h2>V2：通用场上球员</h2>
      <div class="grid" id="field"></div>

      <h2>V2：通用门将</h2>
      <div class="grid" id="keeper"></div>
    </main>
    <script>
      const actions = ["idle", "pass", "shoot", "tackle"];
      const spriteRoot = "/assets/characters/match-chibi-v2";
      const tile = (src, label) => `<figure class="tile"><div class="artbox"><img src="${src}" alt="${label}"></div><figcaption class="label">${label}</figcaption></figure>`;
      document.querySelector("#v1").innerHTML = actions.map((action) => `<figure class="tile"><div class="artbox v1-pair"><img class="body" src="/assets/characters/match-chibi-v1-preview/body/action.${action}.png" alt=""><img class="head" src="/assets/characters/match-chibi-v1-preview/head/head.founder_sakura_link_4.calm.jpg" alt=""></div><figcaption class="label">V1 saya / ${action}</figcaption></figure>`).join("");
      document.querySelector("#saya").innerHTML = actions.map((action) => tile(`${spriteRoot}/saya-${action}.png`, `saya / ${action}`)).join("");
      document.querySelector("#field").innerHTML = ["field-home", "field-away"].flatMap((family) => actions.map((action) => tile(`${spriteRoot}/${family}-${action}.png`, `${family} / ${action}`))).join("");
      document.querySelector("#keeper").innerHTML = ["idle", "save"].map((action) => tile(`${spriteRoot}/keeper-${action}.png`, `keeper / ${action}`)).join("");
    </script>
  </body>
</html>
